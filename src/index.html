<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data: thumbnail:;"
    />
    <title>Video Browser</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Video Browser</h1>
      <p>Choose a folder to recognise and open your videos.</p>
      <form id="folder-form">
        <label for="folder">Folder path</label>
        <div class="folder-controls">
          <input id="folder" type="text" placeholder="C:\Videos" required />
          <button type="submit">Open folder</button>
          <button id="choose" type="button">Choose folder…</button>
          <button id="refresh" type="button" disabled>Refresh</button>
        </div>
      </form>
      <p class="selected">
        <span id="selected-label">Selected folder:</span>
        <span id="selected" role="note" aria-labelledby="selected-label"></span>
      </p>
      <div class="view-controls">
        <label for="size">Thumbnail size</label>
        <input
          id="size"
          type="range"
          min="160"
          max="640"
          step="40"
          value="320"
          aria-valuetext="320 pixels wide"
        />
        <span id="size-value" aria-hidden="true">320 px</span>
        <label for="sort-field">Sort by</label>
        <select id="sort-field">
          <option value="name">Filename</option>
          <option value="modified">Date modified</option>
        </select>
        <label for="sort-direction">Order</label>
        <select id="sort-direction">
          <option value="ascending">A to Z</option>
          <option value="descending">Z to A</option>
        </select>
      </div>
      <p id="status" role="status">Select a folder to begin.</p>
    </header>
    <main id="browse">
      <ul id="grid" aria-label="Source videos"></ul>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
